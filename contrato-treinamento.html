const obrigatorios=new Set(
"data_contrato empresa cnpj_empresa endereco_empresa representante_empresa contratante cpf_cnpj endereco_cliente valor_total valor_extenso parcelas percentual_entrada valor_entrada data_entrada meio_pagamento comarca estado local_assinatura data_assinatura assinante_empresa assinante_representante_empresa assinante_cliente objetivos conteudo distribuicao_horas metodologia atividades_praticas recursos criterios".split(" ")

const padrao=()=>/[{][{]([^|}]+)[|]([^|}]+)(?:[|]([^}]+))?[}][}]/g;
function mensagem(t){
$("msg").hidden=false;

async function api(caminho,opcoes={}){
const r=await fetch(URL+"/rest/v1/"+caminho,{
...opcoes,headers,cache:"no-store"
});
const d=await r.json().catch(()=>null);
if(!r.ok)throw new Error(d?.message||"HTTP "+r.status);
return d;
}
function campo(id,tipo,opcoes){
const e=document.createElement(tipo==="A"?"textarea":tipo==="S"?"select":"input");
e.id=id;
e.name=id;
e.required=obrigatorios.has(id);
e.setAttribute("aria-label",id.replaceAll("_"," "));
if(tipo==="S"){
e.append(new Option("Selecione",""));
opcoes.split("~").forEach(x=>e.append(new Option(x,x)));
}else if(tipo!=="A"){
e.type=({D:"date",N:"number"})[tipo]||"text";
if(tipo==="N"){
e.min="1";
e.step="1";
}
}
return e;
}

div.className="curso";
div.innerHTML=`

<input data-campo="nome" type="text" required>

`;
div.querySelector(".remover").onclick=()=>{
if($("lista-cursos").children.length===1){
alert("É necessário manter pelo menos um curso.");
return;
}
if(confirm("Remover este curso?")){
div.remove();
numerarCursos();
}
};
$("lista-cursos").append(div);
numerarCursos();
}
function numerarCursos(){
document.querySelectorAll(".numero-curso").forEach((e,i)=>{
e.textContent="CURSO "+(i+1);
});
}
function montar(){
$("campos").replaceChildren();
modelo.split(String.fromCharCode(10)).forEach(linha=>{
if(!linha.trim())return;
if(linha==="[[CURSOS_CONTRATADOS]]"){
const div=document.createElement("div");
div.id="lista-cursos";
const botao=document.createElement("button");
botao.type="button";
botao.textContent="+ ADICIONAR OUTRO CURSO";
botao.onclick=adicionarCurso;
$("campos").append(div,botao);
adicionarCurso();
return;
}
if(linha.startsWith("# ")){
const h=document.createElement("h3");
h.textContent=linha.slice(2);
$("campos").append(h);
return;
}
linha=linha.replace("[[NUMERO_CONTRATO]]","AUTOMÁTICO APÓS APROVAÇÃO");
const p=document.createElement("p");
let pos=0;
const re=padrao();
let m;
while((m=re.exec(linha))!==null){
p.append(document.createTextNode(linha.slice(pos,m.index)));
p.append(campo(m[1],m[2],m[3]));
pos=re.lastIndex;
}
p.append(document.createTextNode(linha.slice(pos)));
$("campos").append(p);
});
}
function coletar(){
const d={};
$("formulario").querySelectorAll("[name]").forEach(e=>{
d[e.name]=e.value.trim();
});
d.cursos=Array.from(document.querySelectorAll(".curso")).map(div=>{
const curso={};
div.querySelectorAll("[data-campo]").forEach(e=>{
curso[e.dataset.campo]=e.value.trim();
});
return curso;
});
return d;
}
function dataBR(d){
return d?d.split("-").reverse().join("/"):"________________";
}
function documento(d){
const cursos=d.cursos.map((c,i)=>[
"CURSO "+(i+1)+": "+c.nome,
"Carga horária: "+c.horas+" horas. Participantes: "+c.alunos+". Modalidade: "+c.modalidade+".",
"Início: "+dataBR(c.inicio)+". Conclusão: "+dataBR(c.conclusao)+". Horários: "+c.horarios+".",
"Local: "+c.local+"."
].join(String.fromCharCode(10))).join(String.fromCharCode(10,10));
return modelo.replace(padrao(),(_,id,tipo)=>{
const v=d[id];
if(tipo==="D")return dataBR(v);
return v||"________________";
}).replace(/^# /gm,"")
.replace("[[CURSOS_CONTRATADOS]]",()=>cursos);
}
function validar(d){
if(!$("formulario").reportValidity())return false;
for(const id of obrigatorios){
if(!d[id]){
alert("Preencha todos os campos obrigatórios.");
$(id).focus();
return false;
}
}
for(const c of d.cursos){
if(Object.values(c).some(v=>!v)){
alert("Complete os dados de todos os cursos.");
return false;
}
if(c.conclusao<c.inicio){
alert("A conclusão do curso não pode ser anterior ao início.");
return false;
}
}
const percentual=Number(d.percentual_entrada.replace(",","."));
if(!Number.isFinite(percentual)||percentual<0||percentual>100){
alert("Informe um percentual entre 0 e 100.");
return false;
}
if(Number(d.parcelas)>1&&!d.demais_pagamentos){
alert("Informe os valores e vencimentos das demais parcelas.");
return false;
}
if(d.meio_pagamento==="Outro meio acordado"&&!d.condicoes_pagamento){
alert("Descreva o meio de pagamento acordado.");
return false;
}
if(JSON.stringify(d).includes("[[NUMERO_CONTRATO]]")||
JSON.stringify(d).includes("[[CURSOS_CONTRATADOS]]")){
alert("Texto reservado inválido.");
return false;
}
return true;
}
function visualizar(){
if(iniciado||registro)return;
const d=coletar();
if(!validar(d))return;
dados=d;
$("documento").textContent=documento(d).replace(
"[[NUMERO_CONTRATO]]","PENDENTE DE APROVAÇÃO"
);
$("editor").hidden=true;
$("preview").hidden=false;
$("msg").hidden=true;
window.scrollTo(0,0);
}
function editar(){
if(iniciado||registro)return;
$("preview").hidden=true;
$("editor").hidden=false;
$("msg").hidden=true;
dados=null;
window.scrollTo(0,0);
}
function excluir(){
if(iniciado||registro)return;
if(!confirm("Excluir todo o preenchimento deste contrato?"))return;
montar();
dados=null;
$("documento").textContent="";
$("preview").hidden=true;
$("editor").hidden=false;
mensagem("Preenchimento excluído.");
window.scrollTo(0,0);
}
async function aprovar(){
if(enviando||registro||!dados)return;
if(!iniciado&&!confirm("Aprovar e registrar definitivamente este contrato?"))return;
if(!idEmissao)idEmissao=crypto.randomUUID();
iniciado=true;
enviando=true;
$("aprovar").disabled=true;
$("editar").disabled=true;

(function(){

const formulario=document.getElementById("formulario");
const campos=document.getElementById("campos");

const visualizarOriginal=visualizar;
const aprovarOriginal=aprovar;

const legenda=document.createElement("div");

legenda.style.cssText="background:#eef5ff;border:1px solid #aac1da;border-radius:8px;padding:15px;margin-bottom:20px;font-size:16px;line-height:1.6";

legenda.innerHTML='<strong style="color:#c00000">* Campo obrigatório</strong><br>Campos sem asterisco são opcionais.<br>Você pode visualizar o contrato mesmo sem concluir o preenchimento.';

formulario.insertBefore(legenda,campos);

function marcarObrigatorios(){

const outro=document.getElementById("outro");
const descricao=document.getElementById("outro_descricao");

if(outro&&descricao){
descricao.required=outro.checked;
}

const parcelas=document.getElementById("parcelas");
const demais=document.getElementById("demais_pagamentos");

if(parcelas&&demais){
demais.required=Number(parcelas.value)>1;
}

const meio=document.getElementById("meio_pagamento");
const condicoes=document.getElementById("condicoes_pagamento");

if(meio&&condicoes){
condicoes.required=meio.value==="Outro meio acordado";
}

formulario.querySelectorAll("input,textarea,select").forEach(campo=>{

const anterior=campo.previousElementSibling;
const existe=anterior&&anterior.dataset.marcaObrigatorio==="sim";

if(campo.required&&!existe){

const estrela=document.createElement("span");

estrela.dataset.marcaObrigatorio="sim";
estrela.textContent=" * ";
estrela.title="Campo obrigatório";
estrela.style.cssText="color:#c00000;font-size:21px;font-weight:bold";

campo.before(estrela);

}else if(!campo.required&&existe){

anterior.remove();

}

});

}

const observador=new MutationObserver(marcarObrigatorios);

observador.observe(campos,{
childList:true,
subtree:true
});

formulario.addEventListener("input",marcarObrigatorios);
formulario.addEventListener("change",marcarObrigatorios);

document.getElementById("visualizar").onclick=function(){

if(iniciado||registro)return;

const rascunho=coletar();

document.getElementById("documento").textContent=
documento(rascunho).replace(
"[[NUMERO_CONTRATO]]",
"PENDENTE DE APROVAÇÃO"
);

document.getElementById("editor").hidden=true;
document.getElementById("preview").hidden=false;
document.getElementById("msg").hidden=true;

window.scrollTo(0,0);

};

document.getElementById("aprovar").onclick=function(){

if(registro)return;

if(iniciado){
aprovarOriginal();
return;
}

document.getElementById("preview").hidden=true;
document.getElementById("editor").hidden=false;

marcarObrigatorios();

const faltantes=Array.from(
formulario.querySelectorAll("[required]")
).filter(campo=>!campo.value.trim());

if(faltantes.length){

mensagem("Existem "+faltantes.length+" campos obrigatórios ainda não preenchidos.");

faltantes[0].focus();
formulario.reportValidity();

return;

}

visualizarOriginal();

if(document.getElementById("editor").hidden){
aprovarOriginal();
}

};

marcarObrigatorios();

})();
</script>
</body>
</html>
