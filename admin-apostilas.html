<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apostilas e Cartilhas UTB</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#f4f7fc;color:#132b4c;font:18px Arial,sans-serif}
header{background:#104b9a;color:white;padding:22px}
.topo{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:25px;margin:0 0 8px}
header p{margin:0}
.brasil{display:flex;gap:10px;align-items:center;font-weight:bold}
.brasil svg{width:55px;height:39px}
main{max-width:1000px;margin:auto;padding:20px}
section{background:#fff;border:1px solid #d6e0ed;border-radius:12px;padding:23px;margin:20px 0}
label{display:block;font-weight:bold;margin-bottom:10px}
select{width:100%;padding:15px;font:inherit;border:1px solid #aabbd0;border-radius:8px;background:white;color:#132b4c}
button,.botao{display:inline-block;background:#0860ba;color:white;padding:13px 17px;border:0;border-radius:8px;text-decoration:none;font:inherit;margin:8px 6px 3px 0;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.sec{background:#50647a}
.red{background:#a22c36}
#aviso{min-height:22px;font-weight:bold}
#visualizador{width:100%;height:70vh;border:1px solid #cbd5e3}
.item{border:1px solid #d6e0ed;background:#fafcff;padding:15px;border-radius:9px;margin:10px 0;overflow-wrap:anywhere}
.item h3{margin:0 0 10px}
a.botao{vertical-align:middle}
@media(max-width:600px){
main{padding:10px}
section{padding:15px}
h1{font-size:22px}
}
</style>
</head>
<body>
<header>
<div class="topo">
<div>
<h1>Universo Treinamentos Brasil</h1>
<p>Apostilas e Cartilhas UTB</p>
</div>
<div class="brasil">
<svg viewBox="0 0 60 42" role="img" aria-label="Bandeira do Brasil">
<rect width="60" height="42" fill="#009b3a"/>
<polygon points="30,4 56,21 30,38 4,21" fill="#ffdf00"/>
<circle cx="30" cy="21" r="11" fill="#002776"/>
<path d="M19 19 Q30 14 41 22" stroke="white" stroke-width="2.4" fill="none"/>
</svg>
<span>Ame o Brasil</span>
</div>
</div>
</header>
<main>

<a class="botao sec" href="admin.html">Voltar ao Painel Administrativo</a>

<p id="aviso" role="status" aria-live="polite"></p>

<section>
<label for="curso">Nome do curso</label>
<select id="curso">
<option value="">Selecione o curso</option>
<option>Eletricista Predial</option>
<option>Instalações Elétricas Prediais</option>
<option>Instalações Elétricas Comerciais</option>
<option>Instalações Elétricas Industriais</option>
<option>Instalações Elétricas de Baixa Tensão</option>
<option>Acionamento de Motores Elétricos</option>
<option>NR-10 Básico</option>
<option>NR-10 SEP</option>
<option>NR-10 Reciclagem Básico - 8h</option>
<option>NR-10 Reciclagem Básico - 16h</option>
<option>NR-10 Reciclagem SEP - 8h</option>
<option>NR-10 Reciclagem SEP - 16h</option>
<option>Solar Fotovoltaica - 8h</option>
<option>Aterramento Residencial, Comercial e Industrial - 16h</option>
<option>Inversores de Frequência - 24h</option>
<option>Soft Starter - 24h</option>
<option>Correção do Fator de Potência - 24h</option>
</select>

<button id="procurar" type="button">PROCURAR</button>
<button id="adicionar" type="button">Adicionar nova apostila à biblioteca</button>
<input type="file" id="arquivo" accept="application/pdf,.pdf" hidden>
</section>

<section id="resultado" hidden>
<div id="lista"></div>
</section>

<section id="leitura" hidden>
<h3 id="nomeLeitura"></h3>
<button id="fechar" class="sec" type="button">Fechar apostila</button>
<iframe title="PDF da apostila" id="visualizador"></iframe>
</section>

</main>

<script>
"use strict";

const BASE = "https://xkxlgmmssvllcmhymibj.supabase.co";
const KEY = "sb_publishable_JUkjhi5SCPNUF1NlazBpCQ_EKd3GBxV";
const TABLE = BASE + "/rest/v1/utb_apostilas";
const FILES = BASE + "/storage/v1";
const BUCKET = "utb-apostilas";
const el = id => document.getElementById(id);

let working = false;

function notice(s, error=false) {
  el("aviso").textContent = s;
  el("aviso").style.color = error ? "#ae2536" : "#11632d";
}

function busy(b) {
  working = b;
  el("procurar").disabled = b;
  el("adicionar").disabled = b;
}

function selected() {
  const c = el("curso").value;
  if (!c) throw Error("Selecione o nome do curso.");
  return c;
}

function token() {
  const t = sessionStorage.getItem("utb_access_token");
  if (!t) throw Error("Sessão expirada. Entre novamente no painel administrativo.");
  return t;
}

function safe(p) {
  return p.split("/").map(encodeURIComponent).join("/");
}

async function request(url, method="GET", body=null, headers={}) {
  const r = await fetch(url, {
    method,
    body,
    cache:"no-store",
    headers:{
      apikey:KEY,
      Authorization:"Bearer "+token(),
      ...headers
    }
  });

  const raw = await r.text();
  let data;

  try {
    data = raw ? JSON.parse(raw) : null;
  } catch {
    data = raw;
  }

  if (!r.ok) {
    throw Error(
      data && (data.message || data.error_description || data.error)
      || "Erro HTTP " + r.status
    );
  }
  return data;
}

async function entries(c) {
  return await request(
    TABLE +
    "?select=id,curso_nome,arquivo_nome,arquivo_caminho" +
    "&curso_nome=eq." + encodeURIComponent(c) +
    "&order=criado_em.desc"
  );
}

async function signed(a) {
  const d = await request(
    FILES + "/object/sign/" + BUCKET + "/" + safe(a.arquivo_caminho),
    "POST",
    JSON.stringify({expiresIn:86400}),
    {"Content-Type":"application/json"}
  );

  const p = d && (d.signedURL || d.signedUrl);
  if (!p) throw Error("Não foi possível gerar o link do PDF.");

  return p.startsWith("http")
    ? p
    : FILES + "/" + (p.startsWith("/") ? p.slice(1) : p);
}

function btn(name, doit, css="") {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = name;
  if (css) b.className = css;
  b.addEventListener("click", doit);
  return b;
}

function anchor(name, url) {
  const a = document.createElement("a");
  a.className = "botao";
  a.href = url;
  a.textContent = name;

  if (url.startsWith("https:")) {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  }
  return a;
}

async function download(a) {
  try {
    notice("Preparando download...");

    const r = await fetch(
      FILES + "/object/authenticated/" +
      BUCKET + "/" + safe(a.arquivo_caminho),
      {
        headers:{
          apikey:KEY,
          Authorization:"Bearer "+token()
        }
      }
    );

    if (!r.ok) {
      throw Error("Download não autorizado (HTTP " + r.status + ").");
    }

    const u = URL.createObjectURL(await r.blob());
    const x = document.createElement("a");
    x.href = u;
    x.download = a.arquivo_nome || "apostila.pdf";
    document.body.appendChild(x);
    x.click();
    x.remove();

    setTimeout(() => URL.revokeObjectURL(u), 30000);
    notice("Download iniciado.");

  } catch(e) {
    notice(e.message,true);
  }
}

function closePdf() {
  el("visualizador").src = "about:blank";
  el("leitura").hidden = true;
}

async function search() {
  if (working) return;

  try {
    const c = selected();
    busy(true);
    closePdf();
    notice("Consultando a biblioteca...");

    const docs = await entries(c);

    el("lista").replaceChildren();
    el("resultado").hidden = false;

    if (!docs.length) {
      el("lista").textContent = "A apostila ainda não está cadastrada.";
      notice("Consulta concluída.");
      return;
    }

    for (const doc of docs) {
      const card = document.createElement("div");
      card.className = "item";

      const title = document.createElement("h3");
      title.textContent = doc.curso_nome;

      const filename = document.createElement("p");
      filename.textContent = doc.arquivo_nome;
      card.append(title,filename);

      try {
        const url = await signed(doc);

        const message =
          "Apostila UTB: " + c +
          String.fromCharCode(10) + url;

        const wa = "https://wa.me/?text=" + encodeURIComponent(message);

        const mail =
          "mailto:?subject=" +
          encodeURIComponent("Apostila UTB - "+c) +
          "&body=" + encodeURIComponent(message);

        card.append(
          btn("Abrir apostila", () => {
            el("nomeLeitura").textContent = c;
            el("visualizador").src = url;
            el("leitura").hidden = false;
            el("leitura").scrollIntoView({behavior:"smooth"});
          }),
          btn("Baixar PDF", () => download(doc)),
          anchor("WhatsApp",wa),
          anchor("E-mail",mail)
        );

      } catch(e) {
        const p = document.createElement("p");
        p.textContent = "Erro ao abrir: " + e.message;
        card.appendChild(p);
      }

      card.appendChild(
        btn("Excluir", () => remove(doc), "red")
      );

      el("lista").appendChild(card);
    }

    notice("Apostila encontrada.");

  } catch(e) {
    notice(e.message,true);
  } finally {
    busy(false);
  }
}

async function remove(a) {
  if (!confirm("Excluir definitivamente esta apostila?")) return;

  try {
    busy(true);

    await request(
      TABLE + "?id=eq." + encodeURIComponent(a.id),
      "DELETE"
    );

    try {
      await request(
        FILES + "/object/" + BUCKET + "/" + safe(a.arquivo_caminho),
        "DELETE"
      );
    } catch(e) {
      console.warn("PDF antigo pendente de limpeza",e);
    }

    busy(false);
    await search();
    notice("Apostila excluída.");

  } catch(e) {
    notice(e.message,true);
  } finally {
    busy(false);
  }
}

function choose() {
  try {
    selected();
    token();
    el("arquivo").value = "";
    el("arquivo").click();
  } catch(e) {
    notice(e.message,true);
  }
}

async function upload() {
  const file = el("arquivo").files[0];
  if (!file || working) return;

  let path = "";
  let done = false;

  try {
    const c = selected();

    if (
      !file.name.toLowerCase().endsWith(".pdf") ||
      (file.type && file.type !== "application/pdf")
    ) {
      throw Error("Escolha um PDF válido.");
    }

    busy(true);
    notice("Verificando apostila existente...");

    const docs = await entries(c);
    const old = docs[0];

    if (old && !confirm("Já existe uma apostila. Deseja substituí-la?")) {
      return;
    }

    path = crypto.randomUUID() + ".pdf";
    notice("Enviando PDF...");

    await request(
      FILES + "/object/" + BUCKET + "/" + path,
      "POST",
      file,
      {
        "Content-Type":"application/pdf",
        "x-upsert":"false"
      }
    );

    const data = {
      curso_nome:c,
      titulo:c,
      tipo:"apostila",
      arquivo_nome:file.name,
      arquivo_caminho:path,
      atualizado_em:new Date().toISOString()
    };

    if (old) {
      await request(
        TABLE + "?id=eq." + encodeURIComponent(old.id),
        "PATCH",
        JSON.stringify(data),
        {"Content-Type":"application/json"}
      );
    } else {
      await request(
        TABLE,
        "POST",
        JSON.stringify(data),
        {"Content-Type":"application/json"}
      );
    }

    done = true;

    if (old) {
      try {
        await request(
          FILES + "/object/" + BUCKET + "/" + safe(old.arquivo_caminho),
          "DELETE"
        );
      } catch(e) {
        console.warn("Arquivo anterior pendente",e);
      }
    }

    busy(false);
    await search();
    notice("Apostila cadastrada com sucesso!");

  } catch(e) {
    if (path && !done) {
      try {
        await request(
          FILES + "/object/" + BUCKET + "/" + path,
          "DELETE"
        );
      } catch(x) {
        console.warn(x);
      }
    }

    notice(e.message,true);

  } finally {
    busy(false);
    el("arquivo").value = "";
  }
}

el("procurar").addEventListener("click",search);
el("adicionar").addEventListener("click",choose);
el("arquivo").addEventListener("change",upload);
el("fechar").addEventListener("click",closePdf);

el("curso").addEventListener("change",() => {
  el("resultado").hidden = true;
  closePdf();
  notice("");
});

notice("");
</script>
</body>
</html>
