<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apostilas e Cartilhas UTB</title>
<style>
{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#f3f6fb;color:#14243b;font:18px Arial,sans-serif}
header{background:#104b9a;color:#fff;padding:22px}
.topo{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0 0 8px;font-size:25px}
header p{margin:0}
.brasil{display:flex;align-items:center;gap:9px;font-weight:bold}
.brasil svg{width:55px;height:39px}
main{max-width:1050px;margin:auto;padding:20px}
section{background:#fff;border:1px solid #d9e2ef;border-radius:12px;padding:22px;margin:20px 0}
label{display:block;font-weight:bold;color:#123b71;margin-bottom:10px}
select{width:100%;font:inherit;padding:15px;border:1px solid #aebdd0;border-radius:8px;background:#fff;color:#14243b}
button,.botao{display:inline-block;padding:13px 17px;margin:6px 6px 6px 0;font:inherit;background:#0759ad;color:#fff;border:0;border-radius:8px;cursor:pointer;text-decoration:none}
button:disabled{opacity:.6;cursor:wait}
.secundario{background:#526477}
.perigo{background:#a72b35}
#aviso{min-height:28px;font-weight:bold;white-space:pre-wrap}
.item{padding:15px;border:1px solid #d9e2ef;border-radius:9px;margin-top:12px;background:#f9fbff;overflow-wrap:anywhere}
.item h2{margin:0 0 9px;color:#123b71;font-size:21px}
#visualizador{width:100%;height:68vh;border:1px solid #ccd4df;border-radius:8px}
@media(max-width:600px){main{padding:10px}section{padding:15px}h1{font-size:22px}}
</style>
</head>
<body>
<header>
<div class="topo">
<div><h1>Universo Treinamentos Brasil</h1><p>Apostilas e Cartilhas UTB</p></div>
<div class="brasil">
<svg viewBox="0 0 60 42" role="img" aria-label="Bandeira do Brasil">
<rect width="60" height="42" fill="#009b3a"/>
<polygon points="30,4 56,21 30,38 4,21" fill="#ffdf00"/>
<circle cx="30" cy="21" r="11" fill="#002776"/>
<path d="M19 19 Q30 14 41 22" stroke="#fff" stroke-width="2.4" fill="none"/>
</svg>
<span>Ame o Brasil</span>
</div>
</div>
</header>
<main>
<a href="admin.html" class="botao secundario">Voltar ao Painel Administrativo</a>
<p id="aviso" role="status" aria-live="polite">Carregando funções da biblioteca...</p>
<section>
<label for="curso">Nome do curso</label>
<select id="curso">
<option value="">Selecione o curso</option>
<option>Eletricista Predial</option>
<option>Instalações Elétricas Prediais</option>
<option>Instalações Elétricas Comerciais</option>
<option>Instalações Elétricas Industriais</option>
<option>Instalações Elétricas de Baixa Tensão</option>
<option>Acionamento de Motores Elétricos</option>
<option>NR-10 Básico</option>
<option>NR-10 SEP</option>
<option>NR-10 Reciclagem Básico - 8h</option>
<option>NR-10 Reciclagem Básico - 16h</option>
<option>NR-10 Reciclagem SEP - 8h</option>
<option>NR-10 Reciclagem SEP - 16h</option>
<option>Solar Fotovoltaica - 8h</option>
<option>Aterramento Residencial, Comercial e Industrial - 16h</option>
<option>Inversores de Frequência - 24h</option>
<option>Soft Starter - 24h</option>
<option>Correção do Fator de Potência - 24h</option>
</select>
<div>
<button type="button" id="procurar">PROCURAR</button>
<button type="button" id="adicionar">Adicionar nova apostila à biblioteca</button>
</div>
<input type="file" id="arquivoPDF" accept=".pdf,application/pdf" hidden>
</section>
<section id="resultado" hidden><div id="lista"></div></section>
<section id="leitura" hidden>
<h2 id="tituloLeitura"></h2>
<button type="button" id="fechar" class="secundario">Fechar apostila</button>
<div id="acoesLeitura"></div>
<iframe id="visualizador" title="Visualização da apostila PDF"></iframe>
</section>
</main>
<script>
"use strict";
const URL_BASE = "https://xkxlgmmssvllcmhymibj.supabase.co";
const CHAVE = "sb_publishable_JUkjhi5SCPNUF1NlazBpCQ_EKd3GBxV";
const REST = URL_BASE + "/rest/v1/utb_apostilas";
const STORAGE = URL_BASE + "/storage/v1";
const BALDE = "utb-apostilas";
const TOKEN = sessionStorage.getItem("utb_access_token");
const el = id => document.getElementById(id);
let ocupado = false;
function aviso(texto, erro = false) {
el("aviso").textContent = texto;
el("aviso").style.color = erro ? "#a72b35" : "#12602a";
}
function bloquear(sim) {
ocupado = sim;
el("procurar").disabled = sim;
el("adicionar").disabled = sim;
}
function cursoAtual() {
const curso = el("curso").value;
if (!curso) throw new Error("Primeiro selecione o nome do curso.");
return curso;
}
function autorizar() {
if (!TOKEN) throw new Error("Sessão não encontrada. Entre novamente pelo Painel Administrativo UTB.");
}
async function solicitar(url, metodo = "GET", corpo = null, cabecalhos = {}) {
autorizar();
const resposta = await fetch(url, {
method: metodo,
cache: "no-store",
headers: { apikey: CHAVE, Authorization: "Bearer " + TOKEN, ...cabecalhos },
body: corpo
});
const texto = await resposta.text();
let dados;
try { dados = texto ? JSON.parse(texto) : null; }
catch { dados = texto; }
if (!resposta.ok) {
const detalhe = dados && typeof dados === "object"
? (dados.message || dados.error || dados.msg)
: texto;
throw new Error(detalhe || "Falha de acesso: HTTP " + resposta.status);
}
return dados;
}
function enderecoPDF(caminho) {
return caminho.split("/").map(encodeURIComponent).join("/");
}
async function consultar(curso) {
const filtro = "?select=&curso_nome=eq." + encodeURIComponent(curso) + "&order=criado_em.desc&limit=100";
return await solicitar(REST + filtro);
}
async function assinar(item) {
const dados = await solicitar(
STORAGE + "/object/sign/" + BALDE + "/" + enderecoPDF(item.arquivo_caminho),
"POST", JSON.stringify({expiresIn: 86400}),
{"Content-Type": "application/json"}
);
const caminho = dados && (dados.signedURL || dados.signedUrl);
if (!caminho) throw new Error("Não foi possível gerar o link do PDF.");
return /^https?:///i.test(caminho) ? caminho : STORAGE + "/" + caminho.replace(/^/+/, "");
}
function botao(texto, acao, classe = "") {
const b = document.createElement("button");
b.type = "button";
b.textContent = texto;
b.className = classe;
b.addEventListener("click", acao);
return b;
}
function link(texto, destino, externo = false) {
const a = document.createElement("a");
a.href = destino;
a.textContent = texto;
a.className = "botao";
if (externo) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
return a;
}
async function baixar(item) {
try {
aviso("Preparando download...");
autorizar();
const r = await fetch(STORAGE + "/object/authenticated/" + BALDE + "/" + enderecoPDF(item.arquivo_caminho),
{headers: {apikey: CHAVE, Authorization: "Bearer " + TOKEN}});
if (!r.ok) throw new Error("Não foi possível baixar o PDF (HTTP " + r.status + ").");
const url = URL.createObjectURL(await r.blob());
const a = document.createElement("a");
a.href = url;
a.download = item.arquivo_nome || "apostila.pdf";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(() => URL.revokeObjectURL(url), 30000);
aviso("Download iniciado.");
} catch (e) { aviso(e.message, true); }
}
function fechar() {
el("leitura").hidden = true;
el("visualizador").src = "about:blank";
el("acoesLeitura").replaceChildren();
}
async function procurar() {
if (ocupado) return;
try {
const curso = cursoAtual();
bloquear(true);
aviso("Consultando a biblioteca...");
fechar();
const dados = await consultar(curso);
const lista = el("lista");
lista.replaceChildren();
el("resultado").hidden = false;
if (!dados.length) {
const p = document.createElement("p");
p.textContent = "A apostila ainda não está cadastrada.";
lista.appendChild(p);
aviso("Consulta concluída.");
return;
}
for (const item of dados) {
const caixa = document.createElement("div");
caixa.className = "item";
const h = document.createElement("h2");
h.textContent = item.curso_nome;
const p = document.createElement("p");
p.textContent = item.arquivo_nome;
caixa.append(h, p);
try {
const url = await assinar(item);
caixa.appendChild(botao("Abrir apostila", () => {
el("tituloLeitura").textContent = "Apostila — " + item.curso_nome;
el("visualizador").src = url;
el("leitura").hidden = false;
const msg = "Apostila UTB — " + item.curso_nome + "
" + url;
el("acoesLeitura").replaceChildren(
botao("Baixar PDF", () => baixar(item)),
link("Enviar pelo WhatsApp", "https://wa.me/?text=" + encodeURIComponent(msg), true),
link("Enviar por e-mail", "mailto:?subject=" + encodeURIComponent("Apostila UTB — " + item.curso_nome) + "&body=" + encodeURIComponent(msg))
);
el("leitura").scrollIntoView({behavior: "smooth"});
}));
caixa.appendChild(botao("Baixar PDF", () => baixar(item)));
const mensagem = "Apostila UTB — " + item.curso_nome + "
" + url;
caixa.appendChild(link("Enviar pelo WhatsApp", "https://wa.me/?text=" + encodeURIComponent(mensagem), true));
caixa.appendChild(link("Enviar por e-mail", "mailto:?subject=" + encodeURIComponent("Apostila UTB — " + item.curso_nome) + "&body=" + encodeURIComponent(mensagem)));
} catch (erro) {
const pErro = document.createElement("p");
pErro.textContent = "Falha ao abrir PDF: " + erro.message;
caixa.appendChild(pErro);
}
caixa.appendChild(botao("Excluir apostila", () => excluir(item), "perigo"));
lista.appendChild(caixa);
}
aviso("Apostila encontrada.");
} catch (e) { aviso(e.message, true); }
finally { bloquear(false); }
}
async function excluir(item) {
if (!confirm("Excluir definitivamente a apostila deste curso?")) return;
try {
aviso("Excluindo apostila...");
await solicitar(REST + "?id=eq." + encodeURIComponent(item.id), "DELETE");
try {
await solicitar(STORAGE + "/object/" + BALDE + "/" + enderecoPDF(item.arquivo_caminho), "DELETE");
} catch (erro) { console.warn("Arquivo antigo pendente de limpeza:", erro); }
fechar();
await procurar();
aviso("Cadastro excluído da biblioteca.");
} catch (e) { aviso(e.message, true); }
}
function validarPDF(arquivo) {
if (!arquivo || !/.pdf$/i.test(arquivo.name) ||
(arquivo.type && arquivo.type !== "application/pdf")) {
throw new Error("Escolha um arquivo PDF válido.");
}
}
async function adicionar() {
if (ocupado) return;
try {
cursoAtual();
autorizar();
el("arquivoPDF").value = "";
el("arquivoPDF").click();
} catch (e) { aviso(e.message, true); }
}
async function cadastrarArquivo() {
const arquivo = el("arquivoPDF").files[0];
if (!arquivo || ocupado) return;
let caminho = null;
let salvo = false;
try {
const curso = cursoAtual();
validarPDF(arquivo);
bloquear(true);
const existentes = await consultar(curso);
const anterior = existentes[0] || null;
if (anterior && !confirm("Este curso já tem uma apostila. Deseja substituí-la?")) return;
aviso("Enviando a apostila PDF...");
caminho = crypto.randomUUID() + ".pdf";
await solicitar(STORAGE + "/object/" + BALDE + "/" + caminho,
"POST", arquivo, {"Content-Type": "application/pdf", "x-upsert": "false"});
const dados = {
curso_nome: curso, titulo: curso, tipo: "apostila",
arquivo_nome: arquivo.name, arquivo_caminho: caminho,
atualizado_em: new Date().toISOString()
};
if (anterior) {
await solicitar(REST + "?id=eq." + encodeURIComponent(anterior.id),
"PATCH", JSON.stringify(dados), {"Content-Type": "application/json", "Prefer": "return=representation"});
} else {
await solicitar(REST, "POST", JSON.stringify(dados),
{"Content-Type": "application/json", "Prefer": "return=representation"});
}
salvo = true;
if (anterior) {
try {
await solicitar(STORAGE + "/object/" + BALDE + "/" + enderecoPDF(anterior.arquivo_caminho), "DELETE");
} catch (erro) { console.warn("Arquivo anterior pendente de limpeza:", erro); }
}
bloquear(false);
await procurar();
aviso("Apostila cadastrada com sucesso!");
} catch (e) {
if (caminho && !salvo) {
try { await solicitar(STORAGE + "/object/" + BALDE + "/" + caminho, "DELETE"); }
catch (erro) { console.warn("Arquivo não removido:", erro); }
}
aviso(e.message, true);
} finally {
bloquear(false);
el("arquivoPDF").value = "";
}
}
el("procurar").addEventListener("click", procurar);
el("adicionar").addEventListener("click", adicionar);
el("arquivoPDF").addEventListener("change", cadastrarArquivo);
el("fechar").addEventListener("click", fechar);
el("curso").addEventListener("change", () => {
el("resultado").hidden = true;
fechar();
aviso("Curso selecionado. Clique em PROCURAR.");
});
aviso("Página pronta. Selecione um curso e clique em PROCURAR.");
</script>
</body>
</html>
