<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Propostas Comerciais | Administração UTB
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #dbe3ee;
      padding: 20px;
    }

    .header-conteudo {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .titulo-area h1 {
      margin: 0;
      color: #0d47a1;
      font-size: 26px;
    }

    .titulo-area p {
      margin: 6px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .acoes-topo {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.92;
    }

    .botao-voltar {
      background: #0d47a1;
      color: white;
    }

    .botao-sair {
      background: #111827;
      color: white;
    }

    .botao-nova {
      background: #1565c0;
      color: white;
    }

    .botao-salvar {
      background: #0d47a1;
      color: white;
    }

    .botao-cancelar {
      background: #64748b;
      color: white;
    }

    .botao-editar {
      background: #1565c0;
      color: white;
      padding: 8px 12px;
      font-size: 12px;
    }

    .botao-excluir {
      background: #b91c1c;
      color: white;
      padding: 8px 12px;
      font-size: 12px;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }

    .resumo {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .resumo-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #dbe3ee;
      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.05);
    }

    .resumo-card span {
      display: block;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .resumo-card strong {
      display: block;
      font-size: 28px;
      color: #0d47a1;
    }

    .painel,
    .formulario-area {
      background: white;
      border-radius: 12px;
      padding: 22px;
      border: 1px solid #dbe3ee;
      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.05);
      margin-bottom: 25px;
    }

    .formulario-area {
      display: none;
    }

    .formulario-area.ativo {
      display: block;
    }

    .formulario-area h2 {
      margin: 0 0 20px;
      color: #0d47a1;
      font-size: 22px;
    }

    .grade-formulario {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    .campo label {
      font-weight: bold;
      font-size: 14px;
      color: #334155;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 11px 12px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      background: white;
    }

    .campo textarea {
      min-height: 110px;
      resize: vertical;
    }

    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {
      outline: 2px solid #bfdbfe;
      border-color: #2563eb;
    }

    .acoes-formulario {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .painel-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .painel-topo h2 {
      margin: 0;
      color: #0d47a1;
      font-size: 21px;
    }

    .filtros {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filtros input,
    .filtros select {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 14px;
      background: white;
    }

    .filtros input {
      min-width: 260px;
      flex: 1;
    }

    .tabela-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    th {
      background: #eef4fb;
      color: #0d47a1;
      text-align: left;
      padding: 12px;
      font-size: 13px;
      border-bottom: 1px solid #dbe3ee;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      vertical-align: middle;
    }

    .acoes-tabela {
      display: flex;
      gap: 6px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

      background: #
