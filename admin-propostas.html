<html lang="pt-BR">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Propostas Comerciais | Administração UTB</title>

  <script>
    if (!sessionStorage.getItem("utb_access_token")) {
      window.location.replace("admin-instrutores.html");
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #dbe3ee;
      padding: 20px;
    }

    .topo {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      color: #0d47a1;
      font-size: 26px;
    }

    .subtitulo {
      margin-top: 5px;
      color: #64748b;
    }

    .acoes-topo {
      display: flex;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .azul {
      background: #1565c0;
      color: white;
    }

    .escuro {
      background: #111827;
      color: white;
    }

    .cinza {
      background: #64748b;
      color: white;
    }

    .vermelho {
      background: #b91c1c;
      color: white;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }

    .resumo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .resumo-card,
    .painel,
    .formulario {
      background: white;
      border: 1px solid #dbe3ee;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);

    .resumo-card {
      padding: 20px;
    }

    .resumo-card span {

      font-size: 13px;
      margin-bottom: 8px;
    }

    .resumo-card strong {
      font-size: 28px;
      color: #0d47a1;
    }

    .painel,

      margin-bottom: 25px;
    }

    .formulario {
      display: none;
    }

    .formulario.ativo {
      display: block;
    }

    .cabecalho-painel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      color: #0d47a1;
      font-size: 21px;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .acoes-formulario {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .filtros {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filtros input {
      flex: 1;
      min-width: 250px;
    }

    .tabela {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 950px;
      border-collapse: collapse;
    }

    th {
      background: #eef4fb;
      color: #0d47a1;
      text-align: left;
      padding: 12px;
      font-size: 13px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-elaboracao {
      background: #fef3c7;
      color: #92400e;
    }

    .status-enviada {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-aprovada {
      background: #dcfce7;
      color: #166534;
    }

    .status-recusada {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-cancelada {
      background: #e5e7eb;
      color: #374151;
    }

    .acoes-tabela {
      display: flex;
      gap: 5px;
    }

    .acoes-tabela button {
      padding: 7px 10px;
      font-size: 12px;
    }

    .vazio {
      text-align: center;
      padding: 35px;
      color: #64748b;
    }

    @media (max-width: 800px) {
      .resumo {
        grid-template-columns: repeat(2, 1fr);
      }

      .grade {
        grid-template-columns: 1fr;
      }

      .campo-completo {
        grid-column: auto;
      }
    }

    @media (max-width: 500px) {
      .resumo {
        grid-template-columns: 1fr;
      }

      .acoes-topo {
        width: 100%;
      }

      .acoes-topo button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="topo">
    <div>
      <h1>Propostas Comerciais</h1>
      <div class="subtitulo">

      </div>
    </div>

    <div class="acoes-topo">

      </button>

      <button class="escuro" onclick="sair()">
        SAIR
      </button>
    </div>
  </div>
</header>

<main>

  <section class="resumo">
    <div class="resumo-card">
      <span>Total de propostas</span>
      <strong id="totalPropostas">0</strong>
    </div>

    <div class="resumo-card">
      <span>Em elaboração</span>
      <strong id="totalElaboracao">0</strong>
    </div>

    <div class="resumo-card">
      <span>Enviadas</span>
      <strong id="totalEnviadas">0</strong>
    </div>

    <div class="resumo-card">
      <span>Aprovadas</span>
      <strong id="totalAprovadas">0</strong>
    </div>
  </section>

  <section class="formulario" id="areaFormulario">
    <h2 id="tituloFormulario">Nova Proposta Comercial</h2>

    <form id="formProposta">
      <input type="hidden" id="propostaId">

      <div class="grade">

        <div class="campo">
          <label>Empresa / Instituição *</label>
          <input id="empresa" required>
        </div>

        <div class="campo">
          <label>Nome do contato</label>
          <input id="contato">
        </div>

        <div class="campo">
          <label>E-mail</label>
          <input type="email" id="email">
        </div>

        <div class="campo">
          <label>Telefone / WhatsApp</label>
          <input id="telefone">
        </div>

        <div class="campo">
          <label>Cidade</label>
          <input id="cidade">
        </div>

        <div class="campo">
          <label>UF</label>
          <select id="uf">
            <option value="">Selecione</option>
            <option>AC</option><option>AL</option><option>AP</option>
            <option>AM</option><option>BA</option><option>CE</option>
            <option>DF</option><option>ES</option><option>GO</option>
            <option>MA</option><option>MT</option><option>MS</option>
            <option>MG</option><option>PA</option><option>PB</option>
            <option>PR</option><option>PE</option><option>PI</option>
            <option>RJ</option><option>RN</option><option>RS</option>
            <option>RO</option><option>RR</option><option>SC</option>
            <option>SP</option><option>SE</option><option>TO</option>
          </select>
        </div>

        <div class="campo campo-completo">
          <label>Curso / Treinamento *</label>
          <input
            id="curso"
            placeholder="Ex.: NR-10 Básico 40h"

        <div class="campo">
          <label>Quantidade de participantes</label>
          <input type="number" min="1" id="participantes">
        </div>

          <label>Carga horária</label>
          <input id="cargaHoraria" placeholder="Ex.: 40 horas">
        </div>

        <div class="campo">
          <label>Modalidade</label>
          <select id="modalidade">
            <option value="">Selecione</option>
            <option>Presencial</option>
            <option>Online</option>
            <option>Semipresencial</option>
          </select>
        </div>

        <div class="campo">
          <label>Valor da proposta (R$) *</label>
          <input
            type="number"
            min="0"
            step="0.01"
            id="valor"
            required
          >
        </div>

        <div class="campo">
          <label>Validade da proposta</label>

        </div>

        <div class="campo">

            <option value="aprovada">Aprovada</option>

            <option value="cancelada">Cancelada</option>
          </select>

        <option value="cancelada">Cancelada</option>
      </select>
    </div>

            <th>Empresa / Instituição</th>
            <th>Curso</th>
            <th>Cidade / UF</th>

            <th>Status</th>

          </tr>
        </thead>

      </table>
    </div>

</main>

<script>

  const SUPABASE_URL =
    "https://xkxlgmmssvllcmhymibj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_JUkjhi5SCPNUF1NlazBpCQ_EKd3GBxV";

  let accessToken =
    sessionStorage.getItem(
      "utb_access_token"
    ) || "";

  let propostas = [];

  const form =
    document.getElementById(
      "formProposta"
    );

  const areaFormulario =
    document.getElementById(
      "areaFormulario"
    );

  const busca =
    document.getElementById(
      "busca"
    );

  const filtroStatus =
    document.getElementById(
      "filtroStatus"
    );


  function voltarPainel() {

    window.location.href =
      "admin.html";

  }


  function sair() {

    sessionStorage.removeItem(
      "utb_access_token"
    );

    accessToken = "";

    window.location.replace(
      "admin-instrutores.html"
    );

  }


  function verificarSessao(resposta) {

    if (
      resposta.status === 401 ||
      resposta.status === 403
    ) {

      sair();

      return false;

    }

    return true;

  }


  async function carregarPropostas() {

    try {

      const resposta =
        await fetch(
          `${SUPABASE_URL}/rest/v1/propostas_comerciais?select=*&order=numero.desc`,
          {
            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${accessToken}`

            }
          }
        );


      if (!verificarSessao(resposta)) {

        return;

      }


      if (!resposta.ok) {

        const erro =
          await resposta.text();

        throw new Error(
          erro ||
          "Não foi possível carregar as propostas."
        );

      }


      propostas =
        await resposta.json();


      renderizar();


    } catch (erro) {

      console.error(erro);

      alert(
        "Erro ao carregar propostas: " +
        erro.message
      );

    }

  }


  function novaProposta() {

    form.reset();

    document.getElementById(
      "propostaId"
    ).value = "";

    document.getElementById(
      "status"
    ).value =
      "elaboracao";

document.getElementById(
  "observacoes"
).value =
  "Condições de pagamento: Pix, boleto, cartão de crédito ou débito, conforme negociação com a contratante. Emissão de nota fiscal.";

const dataValidade = new Date();
dataValidade.setDate(
  dataValidade.getDate() + 15
);

const ano = dataValidade.getFullYear();
const mes = String(
  dataValidade.getMonth() + 1
).padStart(2, "0");
const dia = String(
  dataValidade.getDate()
).padStart(2, "0");

document.getElementById(
  "validade"
).value = `${ano}-${mes}-${dia}`;

    
    document.getElementById(
      "tituloFormulario"
    ).textContent =
      "Nova Proposta Comercial";

    areaFormulario.classList.add(
      "ativo"
    );

    areaFormulario.scrollIntoView({
      behavior: "smooth"
    });

  }


  function cancelarFormulario() {

    form.reset();

    document.getElementById(
      "propostaId"
    ).value = "";

    areaFormulario.classList.remove(
      "ativo"
    );

  }


  function formatarNumero(numero) {

    return String(
      numero
    ).padStart(
      4,
      "0"
    );

  }


  function formatarValor(valor) {

    return Number(
      valor || 0
    ).toLocaleString(
      "pt-BR",
      {
        style: "currency",
        currency: "BRL"
      }
    );

  }


  function nomeStatus(status) {

    const nomes = {

      elaboracao:
        "Em elaboração",

      enviada:
        "Enviada",

      aprovada:
        "Aprovada",

      recusada:
        "Recusada",

      cancelada:
        "Cancelada"

    };

    return (
      nomes[status] ||
      status
    );

  }


  function escapar(texto) {

    return String(
      texto || ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function atualizarResumo() {

    document.getElementById(
      "totalPropostas"
    ).textContent =
      propostas.length;


    document.getElementById(
      "totalElaboracao"
    ).textContent =
      propostas.filter(
        p =>
          p.status ===
          "elaboracao"
      ).length;


    document.getElementById(
      "totalEnviadas"
    ).textContent =
      propostas.filter(
        p =>
          p.status ===
          "enviada"
      ).length;


    document.getElementById(
      "totalAprovadas"
    ).textContent =
      propostas.filter(
        p =>
          p.status ===
          "aprovada"
      ).length;

  }


  function renderizar() {

    const tbody =
      document.getElementById(
        "listaPropostas"
      );


    const termo =
      busca.value
        .trim()
        .toLowerCase();


    const filtro =
      filtroStatus.value;


    const lista =
      propostas.filter(
        p => {

          const texto =
            (
              (p.empresa || "") +
              " " +
              (p.contato || "") +
              " " +
              (p.curso || "") +
              " " +
              (p.cidade || "") +
              " " +
              (p.uf || "")
            ).toLowerCase();


          return (

            (
              !termo ||
              texto.includes(
                termo
              )
            )

            &&

            (
              !filtro ||
              p.status === filtro
            )

          );

        }
      );


    if (lista.length === 0) {

      tbody.innerHTML = `
        <tr>
          <td
            colspan="8"
            class="vazio"
          >
            Nenhuma proposta encontrada.
          </td>
        </tr>
      `;

      atualizarResumo();

      return;

    }


    tbody.innerHTML =
      lista.map(
        p => `
          <tr>

            <td>
              ${formatarNumero(
                p.numero
              )}
            </td>

            <td>
              ${escapar(
                p.empresa
              )}
            </td>

            <td>
              ${escapar(
                p.curso
              )}
            </td>

            <td>
              ${escapar(
                [
                  p.cidade,
                  p.uf
                ]
                  .filter(Boolean)
                  .join(" / ")
                  || "-"
              )}
            </td>

            <td>
              ${escapar(
                p.participantes
                || "-"
              )}
            </td>

            <td>
              ${formatarValor(
                p.valor
              )}
            </td>

            <td>

              <span
                class="
                  status
                  status-${escapar(
                    p.status
                  )}
                "
              >
                ${escapar(
                  nomeStatus(
                    p.status
                  )
                )}
              </span>

            </td>

            <td>

              <div
                class="acoes-tabela"
              >

<button
  class="azul"
  onclick="
    gerarPropostaPDF(
      '${p.id}'
    )
  "
>
  IMPRIMIR / PDF
</button>

<button
  class="azul"
  onclick="
    editarProposta(
      '${p.id}'
    )
  "
>
  EDITAR
</button>

<button
  class="vermelho"
  onclick="
    excluirProposta(
      '${p.id}'
    )
  "
>
  EXCLUIR
</button>

              </div>

            </td>

          </tr>
        `
      ).join("");


    atualizarResumo();

  }

function formatarData(data) {

  if (!data) {
    return "-";
  }

  const texto = String(data);

  if (texto.includes("T")) {
    return new Date(texto)
      .toLocaleDateString("pt-BR");
  }

  const partes = texto.split("-");

  if (partes.length === 3) {
    return (
      partes[2] + "/" +
      partes[1] + "/" +
      partes[0]
    );
  }

  return texto;
}

  );

  if (!p) {

    alert(
      "Proposta não encontrada."
    );

    return;
  }


  const numero =
    formatarNumero(p.numero);

    [
      p.cidade,

    ]
      .filter(Boolean)

  const observacoes =
    escapar(
      p.observacoes ||
      "Sem observações adicionais."
    )
    .replace(
      /\n/g,
      "<br>"
    );


  const janela =

    );

    );

  async function excluirProposta(id) {

    const p =
      propostas.find(
        item =>
          item.id === id
      );


    if (!p) {

      return;

    }


    const confirmar =
      confirm(
        "Deseja excluir a proposta " +
        formatarNumero(
          p.numero
        ) +
        "?"
      );


    if (!confirmar) {

      return;

    }


    try {

      const resposta =
        await fetch(
          `${SUPABASE_URL}/rest/v1/propostas_comerciais?id=eq.${id}`,
          {

            method: "DELETE",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${accessToken}`,

              "Prefer":
                "return=minimal"

            }

          }
        );


      if (!verificarSessao(resposta)) {

        return;

      }


      if (!resposta.ok) {

        const erro =
          await resposta.text();

        throw new Error(
          erro ||
          "Não foi possível excluir a proposta."
        );

      }


      await carregarPropostas();


    } catch (erro) {

      alert(
        "Erro ao excluir: " +
        erro.message
      );

    }

  }


  form.addEventListener(
    "submit",
    async function(evento) {

      evento.preventDefault();


      const id =
        document.getElementById(
          "propostaId"
        ).value;


      const participantesValor =
        document.getElementById(
          "participantes"
        ).value;


      const dados = {

        empresa:
          document.getElementById(
            "empresa"
          ).value.trim(),

        contato:
          document.getElementById(
            "contato"
          ).value.trim()
          || null,

        email:

            "email"
          ).value.trim()
          || null,

        telefone:

            "telefone"
          ).value.trim()
          || null,

        cidade:
          document.getElementById(
            "cidade"
          ).value.trim()
          || null,

        uf:
          document.getElementById(
            "uf"
          ).value
          || null,

        curso:
          document.getElementById(
            "curso"
          ).value.trim(),

        participantes:
          participantesValor
          ? Number(
              participantesValor
            )
          : null,

        carga_horaria:
          document.getElementById(
            "cargaHoraria"

          || null,

        modalidade:
          document.getElementById(

          || null,

        valor:

          ),

        validade:

          || null,

        status:
          document.getElementById(
            "status"
          ).value,

        observacoes:
          document.getElementById(
            "observacoes"
          ).value.trim()
          || null

      };


      try {

        let resposta;


        if (id) {

          resposta =
            await fetch(
              `${SUPABASE_URL}/rest/v1/propostas_comerciais?id=eq.${id}`,
              {

                method: "PATCH",

                headers: {

                  "apikey":

                  "Authorization":
                    `Bearer ${accessToken}`,

                  "Content-Type":

                  "Prefer":

                },

                body:

              }
            );


        } else {

          resposta =
            await fetch(
              `${SUPABASE_URL}/rest/v1/propostas_comerciais`,

                method: "POST",

                  "apikey":

                  "Authorization":

                  "Content-Type":
                    "application/json",

                  "Prefer":
                    "return=minimal"

                },

                body:
                  JSON.stringify(
                    dados
                  )

              }
            );

        }


        if (!verificarSessao(resposta)) {

          return;

        }


        if (!resposta.ok) {

          let mensagem =
            "Não foi possível salvar a proposta.";


          try {

            const erro =
              await resposta.json();

            mensagem =
              erro.message ||
              erro.details ||
              mensagem;

          } catch (e) {}


          throw new Error(
            mensagem
          );

        }


        cancelarFormulario();

        await carregarPropostas();

        alert(
          "Proposta salva no Supabase com sucesso."
        );


      } catch (erro) {

        alert(
          "Erro ao salvar proposta: " +
          erro.message
        );

      }

    }
  );
