function mensagem(t){
$("msg").hidden=false;
$("msg").textContent=t;

async function api(caminho,opcoes={}){
const r=await fetch(URL+"/rest/v1/"+caminho,{
...opcoes,headers,cache:"no-store"
});
const d=await r.json().catch(()=>null);
if(!r.ok)throw new Error(d?.message||"HTTP "+r.status);
return d;
}
function campo(id,tipo,opcoes){
const e=document.createElement(tipo==="A"?"textarea":tipo==="S"?"select":"input");
e.id=id;
e.name=id;
e.required=obrigatorios.has(id);
e.setAttribute("aria-label",id.replaceAll("_"," "));
if(tipo==="S"){
e.append(new Option("Selecione",""));
opcoes.split("~").forEach(x=>e.append(new Option(x,x)));
}else if(tipo!=="A"){
e.type=({D:"date",N:"number",C:"checkbox"})[tipo]||"text";
if(tipo==="N"){e.min="0";e.step="1"}
}
if(tipo==="C"){
const l=document.createElement("label");
l.append(e,document.createTextNode(" "+opcoes));
return l;
}
return e;
}
function montar(){
$("campos").replaceChildren();
modelo.split("
").forEach(linha=>{
if(!linha.trim())return;
if(linha.startsWith("# ")){
const h=document.createElement("h3");
h.textContent=linha.slice(2);
$("campos").append(h);
return;
}
linha=linha.replace("[[NUMERO_CONTRATO]]","AUTOMÁTICO APÓS APROVAÇÃO");
const p=document.createElement("p");
let pos=0;
const re=padrao();
let m;
while((m=re.exec(linha))!==null){
p.append(document.createTextNode(linha.slice(pos,m.index)));
p.append(campo(m[1],m[2],m[3]));
pos=re.lastIndex;
}
p.append(document.createTextNode(linha.slice(pos)));
$("campos").append(p);
});
}
function coletar(){
const d={};
$("formulario").querySelectorAll("input,textarea,select").forEach(e=>{
d[e.name]=e.type==="checkbox"?e.checked:e.value.trim();
});
return d;
}
function documento(d){
return modelo.replace(padrao(),(_,id,tipo,rotulo)=>{
const v=d[id];
if(tipo==="C")return "["+(v?"X":" ")+"] "+rotulo;
if(tipo==="D"&&v)return v.split("-").reverse().join("/");
return v||"________________";
}).replace(/^# /gm,"");
}
function visualizar(){
if(iniciado||registro)return;
if(!$("formulario").reportValidity())return;
const d=coletar();
for(const id of obrigatorios){
if(!d[id]){
alert("Preencha os campos obrigatórios.");
$(id).focus();
return;
}
}
if(!atividades.some(a=>d[a])){
alert("Selecione pelo menos uma atividade.");
return;
}
if(d.outro&&!d.outro_descricao){
alert("Descreva os outros serviços.");
$("outro_descricao").focus();
return;
}
if(d.conclusao<d.inicio){
alert("A data de conclusão é anterior ao início.");
return;
}
if(!d.entrada&&!d.valor_parcela&&!d.saldo&&!d.pagamento_adicional){
alert("Informe as condições de pagamento.");
return;
}
if(Object.values(d).some(v=>typeof v==="string"&&v.includes("[[NUMERO_CONTRATO]]"))){
alert("Texto reservado inválido.");
return;
}
dados=d;
$("documento").textContent=documento(d).replace("[[NUMERO_CONTRATO]]","PENDENTE DE APROVAÇÃO");
$("editor").hidden=true;
$("preview").hidden=false;
$("msg").hidden=true;
window.scrollTo(0,0);
}
function editar(){
if(iniciado||registro)return;
$("preview").hidden=true;
$("editor").hidden=false;
dados=null;
window.scrollTo(0,0);
}
function excluir(){
if(iniciado||registro)return;
if(!confirm("Excluir todo o preenchimento?"))return;
$("formulario").reset();
$("documento").textContent="";
dados=null;
$("preview").hidden=true;
$("editor").hidden=false;
mensagem("Preenchimento excluído.");
window.scrollTo(0,0);
}
async function aprovar(){
if(enviando||registro||!dados)return;
if(!iniciado&&!confirm("Aprovar e registrar definitivamente este contrato?"))return;
if(!idEmissao)idEmissao=crypto.randomUUID();
iniciado=true;
enviando=true;
$("aprovar").disabled=true;
$("editar").disabled=true;
$("descartar").disabled=true;
mensagem("Registrando contrato...");
try{
const r=await api("rpc/utb_contratos_emitir",{
method:"POST",
body:JSON.stringify({
p_id:idEmissao,
p_tipo:"ENGENHARIA",
p_data:dados.data_contrato,
p_contratante:dados.contratante,
p_cpf_cnpj:dados.cpf_cnpj,
p_dados:dados,
p_documento:documento(dados),
p_versao:1
})
});
const c=Array.isArray(r)?r[0]:r;
if(!c?.numero||!c.documento_texto){
throw new Error("Registro não confirmado.");
}
registro=c;
$("documento").textContent=c.documento_texto;
$("titulo").textContent="CONTRATO Nº "+c.numero;
$("aprovar").hidden=true;
$("editar").hidden=true;
$("descartar").hidden=true;
$("imprimir").disabled=false;
$("novo").hidden=false;
mensagem("SUCESSO! Contrato "+c.numero+" registrado.");
alert("Contrato registrado com sucesso: "+c.numero);
}catch(e){
mensagem("Erro: "+e.message+"
Tente salvar novamente nesta mesma tela.");
$("aprovar").disabled=false;
$("aprovar").textContent="TENTAR SALVAR NOVAMENTE";
}finally{
enviando=false;
}
}
async function iniciar(){
if(!TOKEN){
location.replace("admin-instrutores.html");
return;
}
try{
const permitido=await api("rpc/utb_contratos_eh_admin",{
method:"POST",body:"{}"
});
if(permitido!==true){
mensagem("Acesso não autorizado.");
return;
}
montar();
$("painel").hidden=false;
$("msg").hidden=true;
}catch(e){
mensagem("Erro de acesso: "+e.message);
}
}
$("formulario").onsubmit=e=>e.preventDefault();
$("visualizar").onclick=visualizar;
$("editar").onclick=editar;
$("excluir").onclick=excluir;
$("descartar").onclick=excluir;
$("aprovar").onclick=aprovar;
$("imprimir").onclick=()=>{if(registro)window.print()};
$("novo").onclick=()=>{location.reload()};
window.addEventListener("beforeunload",e=>{
if(iniciado&&!registro){
e.preventDefault();
e.returnValue="";
}
});
iniciar();
</script>
